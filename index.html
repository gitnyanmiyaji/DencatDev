<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dencat.dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@300;400&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link rel="canonical" href="https://dencat.dev/">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://dencat.dev/">
    <meta property="og:title" content="dencat.dev">
    <meta property="og:description" content="The Digital Garden Portal - Explorer of self-hosted services and community projects.">
    <meta property="og:image" content="https://dencat.dev/assets/favicon.png">
    <meta property="og:site_name" content="dencat.dev">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://dencat.dev/">
    <meta name="twitter:title" content="dencat.dev">
    <meta name="twitter:description" content="The Digital Garden Portal - Explorer of self-hosted services and community projects.">
    <meta name="twitter:image" content="https://dencat.dev/assets/favicon.png">

    <style>
        :root {
            --bg-color: #05070a;
            --accent-color: #88aaff;
            --text-color: #f0f2f5;
            --sidebar-width: 340px;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
        }

        /* --- Background Layers --- */
        .bg-base { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a1c2c 0%, #05070a 100%); z-index: -3; }
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            filter: brightness(1.1); /* Base brightness is higher */
            z-index: -2;
            transition: opacity 1.5s ease-in-out, transform 0.5s ease-out;
        }

        /* Vignette Layer */
        .bg-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 20%, rgba(0,0,0,0.7) 100%);
            z-index: -1.5;
            pointer-events: none;
        }

        .bg-effect { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }

        .particle { position: absolute; pointer-events: none; animation: fall linear infinite; }
        .particle.snow { background: white; border-radius: 50%; opacity: 0.4; filter: blur(1px); }
        .particle.petal { background: #ffc0cb; border-radius: 100% 0% 100% 0%; opacity: 0.6; transform: rotate(45deg); }
        .particle.leaf { background: #d35400; border-radius: 100% 0% 100% 0%; opacity: 0.5; }
        .particle.bubble { border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.1); border-radius: 50%; animation: rise linear infinite; }

        @keyframes fall { from { transform: translateY(-10vh) rotate(0deg); } to { transform: translateY(110vh) rotate(360deg); } }
        @keyframes rise { from { transform: translateY(110vh); opacity: 0; } 50% { opacity: 0.5; } to { transform: translateY(-10vh); opacity: 0; } }

        /* --- Peek Sidebar --- */

        .sidebar {
            position: fixed;
            top: 0;
            left: calc(var(--sidebar-width) * -1 + 40px);
            width: var(--sidebar-width);
            height: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-right: 1px solid var(--glass-border);
            z-index: 100;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 20px 0 50px rgba(0,0,0,0.3);
        }

        .sidebar:hover {
            left: 0;
            background: rgba(255, 255, 255, 0.06);
        }

        .sidebar-handle {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%) rotate(-90deg);
            transform-origin: right center;
            width: 200px;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .sidebar:hover .sidebar-handle { opacity: 0; }
        .handle-text { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.4em; color: rgba(255, 255, 255, 0.3); text-transform: uppercase; }

        .sidebar-content {
            flex-grow: 1;
            padding: 60px 0 0;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.4s 0.1s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto; /* Enable scrolling */
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        }

        /* Custom Scrollbar for Chrome/Safari */
        .sidebar-content::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .sidebar:hover .sidebar-content { opacity: 1; transform: translateX(0); }

        .sidebar-header { padding: 0 32px 32px; }
        .logo {
            font-size: 1.8rem; font-weight: 600; letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 0%, #88aaff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .tagline { font-size: 0.7rem; color: rgba(255, 255, 255, 0.3); letter-spacing: 0.05em; }

        .section-label {
            padding: 24px 32px 8px;
            font-size: 0.65rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .explorer-list { list-style: none; }
        .explorer-item {
            display: flex; align-items: center; padding: 14px 32px;
            text-decoration: none; color: var(--text-color); transition: all 0.3s;
            border-left: 3px solid transparent;
        }
        .explorer-item:hover { background: rgba(255, 255, 255, 0.05); border-left-color: var(--accent-color); padding-left: 38px; }

        .item-icon { width: 18px; height: 18px; margin-right: 14px; color: var(--accent-color); opacity: 0.6; }
        .item-info { display: flex; flex-direction: column; }
        .item-name { font-size: 0.9rem; font-weight: 400; }
        .item-path { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: rgba(255, 255, 255, 0.2); }

        .private-section { margin-top: auto; padding-bottom: 20px; }
        .private-section .item-icon { color: #f87171; }

        .sidebar-footer {
            padding: 24px 32px;
            border-top: 1px solid var(--glass-border);
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.15);
        }
        .yuki-quote { margin-top: 6px; font-style: italic; color: rgba(136, 170, 255, 0.25); }

    </style>
</head>
<body>
    <div class="bg-base"></div>
    <div class="bg-image" id="bgImage"></div>
    <div class="bg-vignette"></div>
    <div class="bg-effect" id="bgEffect"></div>

    <aside class="sidebar">
        <div class="sidebar-handle">
            <span class="handle-text">dencat.dev portal</span>
        </div>

        <div class="sidebar-content">
            <header class="sidebar-header">
                <h1 class="logo">dencat.dev</h1>
                <p class="tagline">The Digital Garden</p>
            </header>

            <div id="public-links">
                <div class="section-label">Public Services</div>
                <nav class="explorer-list" id="public-list"></nav>
            </div>

            <div class="private-section" id="private-links">
                <div class="section-label">Modeling Community</div>
                <nav class="explorer-list" id="private-list"></nav>
            </div>

            <footer class="sidebar-footer">
                <p>&copy; 2026 dencat.dev</p>
                <p class="yuki-quote">"Always by your side." — Yuki</p>
            </footer>
        </div>
    </aside>

    <script>
        /* [[SERVICES_DATA_START]] */
        const servicesData = [
        {
                "id": "home",
                "name": "Home",
                "url": "https://dencat.dev",
                "path": "/root",
                "category": "public",
                "description": "The Digital Garden Portal"
        },
        {
                "id": "invite",
                "name": "Invite System",
                "url": "https://modeling-community.dencat.dev",
                "path": "/discord-join",
                "category": "private",
                "description": "Discord Invite Issuance for Modeling Community"
        },
        {
                "id": "git",
                "name": "Canyon Portal",
                "url": "https://gitnyanmiyaji.github.io/canyon-portal/",
                "path": "/canyon-portal",
                "category": "private",
                "description": "Modeling Community Onboarding & Git Access"
        },
        {
                "id": "trivia",
                "name": "Trivia Silk",
                "url": "https://trivia-silk.dencat.dev",
                "path": "/trivia",
                "category": "private",
                "description": "Personal AI Assistant & Knowledge Base (Restricted Access)"
        },
        {
                "id": "blog",
                "name": "Dev Blog",
                "url": "https://blog.dencat.dev",
                "path": "/blog",
                "category": "public",
                "description": "Development Log & Technical Articles"
        }
];
        /* [[SERVICES_DATA_END]] */

        const effectMap = {
            1: 'snow', 2: 'snow', 12: 'snow',
            3: 'petal', 4: 'petal', 5: 'petal',
            6: 'bubble', 7: 'bubble', 8: 'bubble',
            9: 'leaf', 10: 'leaf', 11: 'leaf'
        };

        function renderServices() {
            const publicList = document.getElementById('public-list');
            const privateList = document.getElementById('private-list');
            
            // Clear existing list to prevent duplicates
            publicList.innerHTML = '';
            privateList.innerHTML = '';
            
            servicesData.forEach(service => {
                const item = document.createElement('a');
                item.href = service.url;
                item.className = 'explorer-item';
                
                const isPrivate = service.category === 'private';
                const icon = isPrivate 
                    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
                    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>';

                item.innerHTML = `
                    <div class="item-icon">${icon}</div>
                    <div class="item-info">
                        <span class="item-name">${service.name}</span>
                        <span class="item-path">${service.path}</span>
                    </div>
                `;
                
                if (isPrivate) {
                    privateList.appendChild(item);
                } else {
                    publicList.appendChild(item);
                }
            });
        }

        function initSeason() {
            const month = new Date().getMonth() + 1;
            const monthStr = month.toString().padStart(2, '0');
            const effect = effectMap[month];
            
            const bgImg = new Image();
            const bgUrl = `./assets/month_${monthStr}.webp`;
            bgImg.src = bgUrl;
            bgImg.onload = () => {
                const el = document.getElementById('bgImage');
                el.style.backgroundImage = `url('${bgUrl}')`;
                el.style.opacity = '0.45'; /* Higher opacity for focus */
            };
            
            const container = document.getElementById('bgEffect');
            const count = effect === 'snow' ? 50 : 30;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = `particle ${effect}`;
                const size = Math.random() * (effect === 'bubble' ? 15 : 5) + 2 + 'px';
                p.style.width = p.style.height = size;
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDuration = Math.random() * 10 + 10 + 's';
                p.style.animationDelay = '-' + Math.random() * 20 + 's';
                container.appendChild(p);
            }
        }

        document.addEventListener('mousemove', (e) => {
            const bgImage = document.getElementById('bgImage');
            const x = (e.clientX / window.innerWidth - 0.5) * 15;
            const y = (e.clientY / window.innerHeight - 0.5) * 15;
            bgImage.style.transform = `scale(1.05) translate(${x}px, ${y}px)`;
        });

        renderServices();
        initSeason();
    </script>
</body>
</html>
